[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurofate"
version = "0.3.1"
description = "Command-line research software for format-aware transcriptomic neurodegeneration risk scoring."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Nabanita Ghosh", email = "nabanitaghosh89@gmail.com" },
  { name = "Krishnendu Sinha", email = "dr.krishnendusinha@gmail.com" }
]
keywords = [
  "neurodegeneration",
  "command-line-interface",
  "transcriptomics",
  "alzheimer-disease",
  "parkinson-disease",
  "risk-scoring",
  "systems-biology"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Operating System :: OS Independent"
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11"
]

[project.scripts]
neurofate = "neurofate.cli:main"

[project.optional-dependencies]
mps = [
  "torch>=2.2"
]
plotting = [
  "matplotlib>=3.8"
]
docs = [
  "mkdocs>=1.6"
]
dev = [
  "build>=1.2",
  "twine>=5.0",
  "pytest>=7.4",
  "ruff>=0.3"
]

[project.urls]
Homepage = "https://github.com/sinhakrishnendu/NeuroFate"
Repository = "https://github.com/sinhakrishnendu/NeuroFate"
Documentation = "https://github.com/sinhakrishnendu/NeuroFate#readme"
Issues = "https://github.com/sinhakrishnendu/NeuroFate/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["neurofate*"]

[tool.setuptools.package-data]
neurofate = ["resources/tiny_demo/*.tsv", "resources/*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
